name: ci

# Pull requests only. Tags are handled by release.yml, pushes to main by
# coverage.yml. secrets runs on every PR; test runs only when Rust code
# changed, ui only when ui/ changed (a skipped required check counts as passing); release-check runs
# only on release/v* branches.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.files.outputs.rust }}
      ui: ${{ steps.files.outputs.ui }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          printf '%s\n' "$files"
          rust=false
          if grep -qE '^(crates/|fuzz/|examples/|sdk/|ui/dist/|Cargo\.(toml|lock)$|deny\.toml$|rust-toolchain\.toml$|Dockerfile$|\.github/workflows/ci\.yml$)' <<<"$files"; then rust=true; fi
          printf 'rust=%s\n' "$rust" >> "$GITHUB_OUTPUT"
          ui=false
          if grep -qE '^(ui/|\.github/workflows/ci\.yml$)' <<<"$files"; then ui=true; fi
          printf 'ui=%s\n' "$ui" >> "$GITHUB_OUTPUT"

  # betterleaks over the PR's commits only. Pinned by version and sha256
  # from the release's checksums.txt; keep the version in step with mise.toml.
  secrets:
    runs-on: ubuntu-26.04
    env:
      BETTERLEAKS_VERSION: "1.9.0"
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install betterleaks
        run: |
          set -euo pipefail
          name="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$name"
          echo "$BETTERLEAKS_SHA256  /tmp/$name" | sha256sum -c -
          mkdir -p ~/.local/bin
          tar -xzf "/tmp/$name" -C ~/.local/bin betterleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: betterleaks git . --redact --no-banner --log-opts="${BASE}..${HEAD}"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    # RFC 0010: the shared store backends, RFC 0017: the WAF agent. Their
    # tests fail in CI when a URL is unset, and skip locally.
    services:
      redis:
        image: redis@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac # 7.4.12-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
      postgres:
        image: postgres@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4 # 17.11-alpine
        # no password: the service is reachable from this job only
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dvarapala
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 15
      pgbouncer:
        image: edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d # 1.26.1
        env:
          DATABASE_URL: postgres://postgres@postgres:5432/dvarapala
          POOL_MODE: transaction
          AUTH_TYPE: trust
          MAX_PREPARED_STATEMENTS: "0"
        ports: ["6432:5432"]
      # RFC 0017 case 12: the image's own config runs the built-in CRS
      # at paranoia 1 on :9000. Keep the version in step with examples/waf/.
      coraza:
        image: ghcr.io/corazawaf/coraza-spoa@sha256:9441c0c4b1ae42060707d24526522ab0532771337544d72d0fea87cd4a899c2e # 0.9.1
        ports: ["9000:9000"]
    env:
      DVARAPALA_TEST_CORAZA: 127.0.0.1:9000
      DVARAPALA_TEST_REDIS: redis://127.0.0.1:6379/0
      DVARAPALA_TEST_POSTGRES: postgres://postgres@127.0.0.1:5432/dvarapala?sslmode=disable
      DVARAPALA_TEST_PGBOUNCER: postgres://postgres@127.0.0.1:6432/dvarapala?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup on the runner installs the toolchain from rust-toolchain.toml
      # on the first cargo call.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: file-size
        run: |
          # domain scoping: no Rust file over 500 lines (CLAUDE.md)
          big=$(find crates -name '*.rs' -exec wc -l {} + 2>/dev/null | awk '$2 != "total" && $1 > 500')
          if [ -n "$big" ]; then
            printf '::error::split these files by concern (limit 500 lines):\n%s\n' "$big"
            exit 1
          fi
      - run: cargo fmt --all --check
      # the BPF program is its own workspace
      - run: rustfmt --check --edition 2024 crates/xdp-ebpf/src/main.rs
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      # RFC 0011 cases 3 to 8 and 12: the XDP program in the kernel, as root.
      # sudo-rs ignores -E, so the variable goes through env; the step fails
      # when the tests skip.
      - name: xdp kernel tests
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo env DVARAPALA_TEST_XDP=1
        run: |
          set -o pipefail
          cargo test --locked -p dvarapala-xdp --features load --test program -- --nocapture 2>&1 | tee xdp.log
          if grep -q 'skipped: DVARAPALA_TEST_XDP' xdp.log; then
            echo "::error::the XDP kernel tests skipped"
            exit 1
          fi
      # RFC 0011 case 13: the checked-in object is what the source builds.
      # The nightly comes from crates/xdp-ebpf/rust-toolchain.toml; its
      # LLVM must match bpf-linker's. Pinned by version and the sha256 of
      # the release asset (GitHub's digest; the release has no checksums.txt).
      - name: xdp object
        env:
          BPF_LINKER_VERSION: "0.12.0"
          BPF_LINKER_SHA256: 6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679
        run: |
          set -euo pipefail
          name=bpf-linker-x86_64-unknown-linux-musl.tar.zst
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/$name"
          echo "$BPF_LINKER_SHA256  /tmp/$name" | sha256sum -c -
          mkdir -p ~/.local/bin
          tar --zstd -xf "/tmp/$name" -C ~/.local/bin bpf-linker
          export PATH="$HOME/.local/bin:$PATH"
          (cd crates/xdp-ebpf && CARGO_TARGET_DIR=/tmp/xdp-ebpf cargo build --locked --release)
          cmp /tmp/xdp-ebpf/bpfel-unknown-none/release/dvarapala-xdp crates/xdp/dvarapala-xdp.o || {
            echo "::error::crates/xdp/dvarapala-xdp.o is stale, rebuild it from crates/xdp-ebpf"
            exit 1
          }
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xdp-object
          path: /tmp/xdp-ebpf/bpfel-unknown-none/release/dvarapala-xdp
          if-no-files-found: ignore
          retention-days: 14
      # the binary without default features (no tls) must still build,
      # lint clean and refuse tls config
      - run: cargo clippy --locked -p dvarapala --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked -p dvarapala --no-default-features
      # RFC 0008 case 8: the committed C header matches the ABI. Keep the
      # version in step with mise.toml.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cbindgen@0.29.4
      - name: header
        run: |
          cbindgen --config crates/ffi/cbindgen.toml --crate dvarapala-ffi --output crates/ffi/dvarapala.h
          git diff --exit-code crates/ffi/dvarapala.h || { echo "::error::crates/ffi/dvarapala.h is stale, regenerate it with cbindgen"; exit 1; }

  # RFC 0001 case 17: the release binary idles under 10 MB RSS. Also a
  # smoke test: no upstream behind it, so a request is a 502 and shows up
  # in /metrics.
  footprint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release -p dvarapala
      # The release image is FROM scratch: without a CA bundle the OIDC
      # client and https upstreams find no roots. The glibc binary only fills
      # the COPY; release.yml builds the image from musl binaries.
      - name: image has root CAs
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 && cp target/release/dvarapala dist/amd64/
          docker build -q --platform linux/amd64 -t dvarapala:ci . >/dev/null
          id=$(docker create dvarapala:ci)
          docker cp "$id:/etc/ssl/certs/ca-certificates.crt" "$RUNNER_TEMP/ca.crt"
          docker rm "$id" >/dev/null
          n=$(grep -c 'BEGIN CERTIFICATE' "$RUNNER_TEMP/ca.crt")
          echo "image roots: $n"
          [ "$n" -gt 50 ] || { echo "::error::image has $n root certificates"; exit 1; }
          rm -rf dist
      - name: idle RSS and smoke
        run: |
          set -euo pipefail
          ./target/release/dvarapala serve --config examples/dvarapala.toml &
          pid=$!
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:9090/metrics && break; sleep 0.1; done
          rss=$(awk '/^VmRSS/ {print $2}' "/proc/$pid/status")
          echo "idle RSS: ${rss} kB"
          [ "$rss" -lt 10240 ] || { echo "::error::idle RSS ${rss} kB, limit 10240 kB"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          [ "$code" = 502 ] || { echo "::error::expected 502 without upstream, got $code"; exit 1; }
          curl -fs http://127.0.0.1:9090/metrics | grep -q '^dvarapala_upstream_errors_total 1'
          kill -TERM "$pid"
          wait "$pid"
      # RFC 0003 case 18: the same budget with a TLS listener
      - name: idle RSS and smoke with TLS
        env:
          DVARAPALA__TLS__CERT: ${{ runner.temp }}/cert.pem
          DVARAPALA__TLS__KEY: ${{ runner.temp }}/key.pem
        run: |
          set -euo pipefail
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost -days 1 \
            -keyout "$DVARAPALA__TLS__KEY" -out "$DVARAPALA__TLS__CERT" 2>/dev/null
          ./target/release/dvarapala serve --config examples/dvarapala.toml &
          pid=$!
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:9090/metrics && break; sleep 0.1; done
          rss=$(awk '/^VmRSS/ {print $2}' "/proc/$pid/status")
          echo "idle RSS with TLS: ${rss} kB"
          [ "$rss" -lt 10240 ] || { echo "::error::idle RSS ${rss} kB, limit 10240 kB"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$DVARAPALA__TLS__CERT" https://localhost:8080/)
          [ "$code" = 502 ] || { echo "::error::expected 502 over TLS without upstream, got $code"; exit 1; }
          curl -fs http://127.0.0.1:9090/metrics | grep -q '^dvarapala_tls_handshakes_total{result="ok"} 1'
          kill -TERM "$pid"
          wait "$pid"
      # RFC 0004: HTTP/2 upstream, a gRPC client gets UNAVAILABLE in gRPC form
      - name: grpc smoke over h2c
        env:
          DVARAPALA__UPSTREAM_PROTOCOL: http2
        run: |
          set -euo pipefail
          ./target/release/dvarapala serve --config examples/dvarapala.toml &
          pid=$!
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:9090/metrics && break; sleep 0.1; done
          headers=$(curl -s -D - -o /dev/null --http2-prior-knowledge -X POST \
            -H 'content-type: application/grpc' -H 'te: trailers' \
            http://127.0.0.1:8080/test.Echo/Unary)
          grep -qi '^grpc-status: 14' <<<"$headers" || { echo "::error::expected grpc-status 14, got: $headers"; exit 1; }
          curl -fs http://127.0.0.1:9090/metrics | grep -q '^dvarapala_grpc_local_responses_total{status="unavailable"} 1'
          kill -TERM "$pid"
          wait "$pid"
      # RFC 0006 case 17: HTTP/3 adds under 2 MB. After the smoke tests: it
      # rebuilds the binary.
      - name: http3 size budget
        run: |
          set -euo pipefail
          base=$(stat -c %s target/release/dvarapala)
          cargo build --locked --release -p dvarapala --features http3
          h3=$(stat -c %s target/release/dvarapala)
          echo "binary: ${base} bytes, with http3: ${h3} bytes"
          [ $((h3 - base)) -lt 2097152 ] || { echo "::error::http3 adds $((h3 - base)) bytes, budget 2097152"; exit 1; }
          echo "BASE_SIZE=$base" >> "$GITHUB_ENV"
      # RFC 0011 case 14: the XDP loader adds under 1 MB
      - name: xdp size budget
        run: |
          set -euo pipefail
          cargo build --locked --release -p dvarapala --features xdp
          xdp=$(stat -c %s target/release/dvarapala)
          echo "binary: ${BASE_SIZE} bytes, with xdp: ${xdp} bytes"
          [ $((xdp - BASE_SIZE)) -lt 1048576 ] || { echo "::error::xdp adds $((xdp - BASE_SIZE)) bytes, budget 1048576"; exit 1; }

  # RFC 0008 cases 9, 10, 17: the Go package over the static library
  go:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release -p dvarapala-ffi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

  # RFC 0008 cases 11, 19: the Python package over the shared library.
  # The oldest supported Python, stdlib unittest only.
  python:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release -p dvarapala-ffi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - working-directory: sdk/python
        env:
          DVARAPALA_LIB: ${{ github.workspace }}/target/release/libdvarapala.so
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  # RFC 0008 cases 12, 18: the JavaScript package over the N-API addon,
  # on the oldest supported Node
  js:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release -p dvarapala-node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - working-directory: sdk/js
        env:
          DVARAPALA_NODE: ${{ github.workspace }}/target/release/libdvarapala_node.so
        run: |
          node --test
          npx --yes -p typescript@5.9.3 tsc --noEmit --strict --module nodenext --moduleResolution nodenext test/types.ts

  # RFC 0018 cases 18 to 20: the console's tests and accessibility scan,
  # its 120 KiB gzip budget, and ui/dist matching a fresh build
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # skips until ui/ exists, so a lower stack layer passes
      - id: has
        run: |
          if [ -f ui/package.json ]; then echo "ui=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.ui == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - if: steps.has.outputs.ui == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run check

  # RustSec advisories, licenses, duplicate crates, sources (deny.toml)
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The cargo-fuzz targets whose code the PR changed (fuzz/select.sh), 60 s
  # each, from the corpus the nightly run (fuzz.yml) keeps in the cache. A
  # crash fails the job and the reproducer is uploaded.
  fuzz:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          targets=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | fuzz/select.sh | xargs)
          echo "targets: ${targets:-none}"
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.targets != ''
        run: rustup toolchain install nightly --profile minimal
      - if: steps.pick.outputs.targets != ''
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      - if: steps.pick.outputs.targets != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - if: steps.pick.outputs.targets != ''
        env:
          TARGETS: ${{ steps.pick.outputs.targets }}
        run: |
          # install-action ships a musl cargo-fuzz, which defaults to the
          # musl target; ASan needs glibc
          for t in $TARGETS; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60
          done
      - if: failure() && steps.pick.outputs.targets != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 14

  # site/install.sh and scripts/homebrew-formula.sh against the latest
  # release, on both release platforms
  install:
    strategy:
      matrix:
        runner: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: shellcheck site/install.sh scripts/homebrew-formula.sh
      - name: install.sh
        run: |
          DVARAPALA_INSTALL="$RUNNER_TEMP/bin" sh site/install.sh
          "$RUNNER_TEMP/bin/dvarapala" --version
      - name: homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          scripts/homebrew-formula.sh "${tag#v}" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/dvarapala.rb"
          ruby -c "$RUNNER_TEMP/dvarapala.rb"

  release-check:
    if: startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-26.04
    env:
      BRANCH: ${{ github.head_ref }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Branch, title, Cargo.toml and CHANGELOG.md agree
        run: |
          want="${BRANCH#release/v}"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          fail=0
          [ "$version" = "$want" ] || { echo "::error::Cargo.toml version $version, branch says $want"; fail=1; }
          [ "$TITLE" = "release: v$want" ] || { echo "::error::PR title must be 'release: v$want'"; fail=1; }
          grep -q "^## \[$want\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$want]' section, run git cliff"; fail=1; }
          exit "$fail"
      - name: Implemented RFCs are documented
        # every RFC marked implemented in ROADMAP.md is referenced as
        # "RFC NNNN" in README.md, CONFIG.md and the site's landing page;
        # the site's config, examples and roadmap pages are generated
        run: |
          fail=0
          for n in $(sed -n 's/^| \[\([0-9]\{4\}\)\](.*| implemented |.*/\1/p' ROADMAP.md); do
            for f in README.md CONFIG.md site/index.html; do
              grep -q "RFC $n" "$f" || { echo "::error file=$f::RFC $n is implemented but not referenced in $f"; fail=1; }
            done
          done
          exit "$fail"
