name: coverage

# Tests with coverage on every push to main that touches Rust code. The
# results go to the orphan branch `badges` as shields.io endpoint JSON
# (written through the contents API, so the commits are signed); README
# badges read them from there.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    # The same services as the `test` job in ci.yml: the store and WAF
    # tests fail in CI when their URL is unset. Keep the two in step.
    services:
      redis:
        image: redis@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac # 7.4.12-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
      postgres:
        image: postgres@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81 # 17.11-alpine
        # no password: the service is reachable from this job only
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dvarapala
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 15
      pgbouncer:
        image: edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d # 1.26.1
        env:
          DATABASE_URL: postgres://postgres@postgres:5432/dvarapala
          POOL_MODE: transaction
          AUTH_TYPE: trust
          MAX_PREPARED_STATEMENTS: "0"
        ports: ["6432:5432"]
      # RFC 0017 case 12: the image's own config runs the built-in CRS
      # at paranoia 1 on :9000. Keep the version in step with examples/waf/.
      coraza:
        image: ghcr.io/corazawaf/coraza-spoa@sha256:9441c0c4b1ae42060707d24526522ab0532771337544d72d0fea87cd4a899c2e # 0.9.1
        ports: ["9000:9000"]
    env:
      DVARAPALA_TEST_CORAZA: 127.0.0.1:9000
      DVARAPALA_TEST_REDIS: redis://127.0.0.1:6379/0
      DVARAPALA_TEST_POSTGRES: postgres://postgres@127.0.0.1:5432/dvarapala?sslmode=disable
      DVARAPALA_TEST_PGBOUNCER: postgres://postgres@127.0.0.1:6432/dvarapala?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - name: Test with coverage
        run: |
          set -o pipefail
          # one instrumented build for both runs below; crates/node is
          # N-API glue, covered by the js job in ci.yml
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test --locked --workspace --all-features --exclude dvarapala-node 2>&1 | tee test.log
          # RFC 0011: the XDP program in the kernel, as root (see ci.yml);
          # sudo-rs ignores -E, so the variables go through env
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="sudo env DVARAPALA_TEST_XDP=1 LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE" \
            cargo test --locked --workspace --all-features --exclude dvarapala-node --test program -- --nocapture 2>&1 | tee xdp.log
          if grep -q 'skipped: DVARAPALA_TEST_XDP' xdp.log; then
            echo "::error::the XDP kernel tests skipped"
            exit 1
          fi
          sudo chown -R "$(id -u):$(id -g)" target
          cargo llvm-cov report --json --summary-only --output-path cov.json
          passed=$(grep -oE 'test result: ok\. [0-9]+ passed' test.log | awk '{s+=$4} END {print s+0}')
          percent=$(jq -r '.data[0].totals.lines.percent | floor' cov.json)
          echo "PASSED=$passed" >> "$GITHUB_ENV"
          echo "PERCENT=$percent" >> "$GITHUB_ENV"
          {
            echo "$passed tests passed, $percent% lines covered"
            echo
            echo "Uncovered lines per file, most first:"
            echo
            jq -r '.data[0].files[] | [(.summary.lines.count - .summary.lines.covered), .filename] | @tsv' cov.json \
              | sort -rn | head -20 | sed 's/^/    /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish badges
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          color=red
          if [ "$PERCENT" -ge 80 ]; then color=brightgreen
          elif [ "$PERCENT" -ge 60 ]; then color=yellowgreen
          elif [ "$PERCENT" -ge 40 ]; then color=yellow; fi
          put() {
            local path="repos/${GITHUB_REPOSITORY}/contents/$1" sha
            sha=$(gh api "${path}?ref=badges" --jq .sha 2>/dev/null || true)
            local args=(-f branch=badges -f message="$1 for ${GITHUB_SHA:0:7}" -f content="$(printf '%s' "$2" | base64 -w0)")
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api --method PUT "$path" "${args[@]}" --silent
          }
          put coverage.json "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${PERCENT}%\",\"color\":\"${color}\"}"
          put tests.json "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${PASSED} passed\",\"color\":\"brightgreen\"}"
