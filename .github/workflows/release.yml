name: release

# v* tags only, cut from main after a release/v* branch merged (CLAUDE.md,
# "Release flow"). Tests already ran in ci.yml on the release PR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag matches the workspace version and is on main
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main, merge the release branch first"
            exit 1
          }
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no '## [$v]' section"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          retention-days: 7

  # Each target builds natively on its own runner (no cross toolchains, no QEMU).
  binary:
    needs: verify
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-release
      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET" -p dvarapala
          mkdir -p dist
          tar -czf "dist/dvarapala-${GITHUB_REF_NAME}-${TARGET}.tar.gz" -C "target/${TARGET}/release" dvarapala
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dvarapala-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  # The image's binaries: Linux musl with the shared-state stores (RFC 0010),
  # since replicas behind one load balancer are the usual container setup.
  # The release tarballs above stay without them.
  image-binary:
    needs: verify
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-image
      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET" -p dvarapala --features redis,postgres
          cargo build --release --locked --target "$TARGET" -p dvarapala-operator
          mkdir -p dist
          tar -czf "dist/image-${TARGET}.tar.gz" -C "target/${TARGET}/release" dvarapala dvarapala-operator
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  # RFC 0008: the libraries the SDKs load, per target. glibc, not musl:
  # Python and Node load a shared library, which a static musl build is not.
  sdk:
    needs: verify
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-sdk
      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET" -p dvarapala-ffi -p dvarapala-node
          out="target/${TARGET}/release"
          mkdir -p sdk-dist dist
          cp crates/ffi/dvarapala.h "$out/libdvarapala.a" sdk-dist/
          cp "$out"/libdvarapala.so "$out"/libdvarapala.dylib sdk-dist/ 2>/dev/null || true
          cp "$out"/libdvarapala_node.so sdk-dist/dvarapala.node 2>/dev/null \
            || cp "$out"/libdvarapala_node.dylib sdk-dist/dvarapala.node
          tar -czf "dist/dvarapala-sdk-${GITHUB_REF_NAME}-${TARGET}.tar.gz" -C sdk-dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dvarapala-sdk-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  # ghcr.io/<owner>/dvarapala:<version>, linux/amd64 and linux/arm64, from the
  # image-binary builds (Dockerfile), so it builds both without emulation.
  image:
    needs: image-binary
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*-linux-musl
          path: artifacts
          merge-multiple: true
      - name: Unpack per Docker arch
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            mkdir -p "dist/$arch"
            tar -xzf "artifacts/image-${pair#*:}-unknown-linux-musl.tar.gz" -C "dist/$arch"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      # RFC 0019: ghcr.io/<owner>/dvarapala-operator, same tags
      - id: meta-operator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}-operator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish:
    needs: [binary, sdk, image]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/operator.yaml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dvarapala-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # RFC 0019: the operator manifest, pinned to this release's images
          sed "s/__VERSION__/${GITHUB_REF_NAME#v}/g" deploy/operator.yaml > dist/operator.yaml
          (cd dist && sha256sum dvarapala-*.tar.gz operator.yaml > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*

  # The library crates and the binary on crates.io, after the GitHub
  # release. Trusted publishing (OIDC): no stored token, each crate lists
  # this workflow as its trusted publisher on crates.io.
  crates:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
