name: title-check

# PR titles become the squash commit on main and feed git-cliff, so they
# follow Conventional Commits: a type from the list, an optional scope from
# the list, and a subject that does not start with an uppercase letter.
# The body must not carry agent session links (claude.ai/code/session_...):
# they leak private context into a public repo.
# pull_request_target: also runs for PRs from forks; it reads only the title
# and body from the event and never checks out the PR's code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            ci
            test
            refactor
            perf
            build
            chore
            release
            rfc
          scopes: |
            engine
            l4
            l7
            proxy
            store
            xdp
            ffi
            operator
            ui
            sdk
            cli
            config
            metrics
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must not start with an uppercase letter.
      - name: no session links in the body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE 'claude\.ai/code/session_'; then
            echo "::error::PR body contains a claude.ai session link; remove it"
            exit 1
          fi
