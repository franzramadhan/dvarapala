name: fuzz

# Every cargo-fuzz target for 10 minutes, nightly on main. The corpus is kept
# in the cache, so each run starts where the last one stopped, and the PR
# fuzz job in ci.yml starts from it too. A crash fails the run and the
# reproducer is uploaded.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: |
          # install-action ships a musl cargo-fuzz, which defaults to the
          # musl target; ASan needs glibc
          for t in $(basename -s .rs fuzz/fuzz_targets/*.rs); do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=600
          done
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 14
