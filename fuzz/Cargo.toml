[package]
name = "dvarapala-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
dvarapala-engine = { path = "../crates/engine", features = ["ml"] }
dvarapala-ffi = { path = "../crates/ffi" }
dvarapala-l7 = { path = "../crates/l7", features = ["llm", "replay", "ui", "waf"] }
dvarapala-proxy = { path = "../crates/proxy", features = ["tls"] }
http = "1.5.0"
libfuzzer-sys = "0.4.13"
# RFC 0006 case 16: the QUIC endpoint the listener runs
bytes = "1.12.1"
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls-pki-types = "1.15.1"
# RFC 0010 case 14: replies the Redis backend decodes
dvarapala-store = { path = "../crates/store", features = ["redis"] }
redis = { version = "1.8.0", default-features = false }
# RFC 0011 case 2: the XDP packet parser
dvarapala-xdp-common = { path = "../crates/xdp-common" }
# RFC 0019 case 11: the operator's route rewrite
dvarapala-operator = { path = "../crates/operator" }
serde_json = "1.0.154"

# Its own workspace: fuzzing needs nightly and sanitizer flags that the main
# workspace must not inherit.
[workspace]
members = ["."]

[[bin]]
name = "client_key"
path = "fuzz_targets/client_key.rs"
test = false
doc = false
bench = false

