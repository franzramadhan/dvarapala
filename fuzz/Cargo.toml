[package]
name = "dvarapala-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
dvarapala-engine = { path = "../crates/engine", features = ["ml"] }
dvarapala-l7 = { path = "../crates/l7" }
dvarapala-proxy = { path = "../crates/proxy", features = ["tls"] }
http = "1.5.0"
libfuzzer-sys = "0.4.13"

# Its own workspace: fuzzing needs nightly and sanitizer flags that the main
# workspace must not inherit.
[workspace]
members = ["."]

[[bin]]
name = "client_key"
path = "fuzz_targets/client_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_model"
path = "fuzz_targets/tree_model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pem"
path = "fuzz_targets/pem.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grpc_content_type"
path = "fuzz_targets/grpc_content_type.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upgrade_headers"
path = "fuzz_targets/upgrade_headers.rs"
test = false
doc = false
bench = false
