[package]
name = "dvarapala-store"
description = "Shared state for dvarapala clusters: memory, Redis and PostgreSQL backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Each backend is opt-in so the default binary does not grow (RFC 0010).
redis = ["dep:redis"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types"]

[dependencies]
dvarapala-engine.workspace = true
metrics.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
redis = { version = "1.8.0", default-features = false, features = ["tokio-rustls-comp"], optional = true }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"], optional = true }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "io-util", "sync"] }

[[bench]]
name = "sync"
harness = false
