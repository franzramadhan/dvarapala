[package]
name = "dvarapala-l7"
description = "HTTP protection layers for dvarapala (tower)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dvarapala-engine.workspace = true
# RFC 0012: the challenge page body
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
metrics.workspace = true
pin-project-lite.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
tracing.workspace = true
# RFC 0012: HMAC passes and the proof-of-work hash; already in the tree
# through rustls
ring.workspace = true
# RFC 0016: access log lines for dvarapala replay
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
replay = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
criterion.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[[bench]]
name = "routes"
harness = false
