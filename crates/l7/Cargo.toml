[package]
name = "dvarapala-l7"
description = "HTTP protection layers for dvarapala (tower)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dvarapala-engine.workspace = true
# RFC 0012: the challenge page body
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
metrics.workspace = true
pin-project-lite.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
tracing.workspace = true
# RFC 0012: HMAC passes and the proof-of-work hash; already in the tree
# through rustls
ring.workspace = true
# RFC 0016: access log lines for dvarapala replay; RFC 0018: OIDC claims
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# RFC 0017: the SPOP client to the WAF agent; both already in the tree
http-body = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "net", "sync", "time"] }

[features]
replay = ["dep:serde", "dep:serde_json"]
# RFC 0018: OIDC login for the admin console
ui = ["dep:serde_json"]
llm = ["dep:serde_json"]
waf = ["dep:http-body", "dep:tokio"]

[dev-dependencies]
criterion.workspace = true
# RFC 0017: the counters the WAF tests read
metrics-exporter-prometheus.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tower = { workspace = true, features = ["util"] }

[[bench]]
name = "routes"
harness = false

[[bench]]
name = "waf"
harness = false
required-features = ["waf"]
