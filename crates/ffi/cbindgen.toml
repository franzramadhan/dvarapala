# RFC 0008: `cbindgen --config crates/ffi/cbindgen.toml --crate dvarapala-ffi
# --output crates/ffi/dvarapala.h`. CI fails when the committed header is stale.
language = "C"
include_guard = "DVARAPALA_H"
autogen_warning = "/* Generated by cbindgen from crates/ffi. Do not edit. */"
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true

[export]
prefix = ""

[enum]
rename_variants = "ScreamingSnakeCase"
