[package]
name = "dvarapala-ffi"
description = "C ABI over the dvarapala engine for the Go, Python and JavaScript SDKs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "dvarapala"
# rlib for the tests and the fuzz target
crate-type = ["cdylib", "staticlib", "rlib"]

# The engine, and serde_json for the list-shaped keys (RFC 0028): no
# runtime, nothing to unwind into the host.
[dependencies]
dvarapala-engine.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "check"
harness = false
