[package]
name = "dvarapala-engine"
description = "Verdict engine for dvarapala: limiters and rules, no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# XGBoost JSON models (RFC 0002). The only reason the engine has dependencies.
ml = ["dep:serde", "dep:serde_json"]

# No other dependencies on purpose: the engine embeds anywhere, including the C ABI.
[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "detect"
harness = false

[[bench]]
name = "blocks"
harness = false
