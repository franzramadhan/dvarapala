[package]
name = "dvarapala-proxy"
description = "Reverse proxy core and HTTP server for dvarapala"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# TLS listener and https:// upstreams (RFC 0003).
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types", "dep:hyper-rustls", "dep:tokio-rustls"]

[dependencies]
dvarapala-l7.workspace = true
bytes.workspace = true
# typed GOAWAY reasons; already in the tree through hyper
h2.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "client", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server-auto", "server-graceful", "tokio"] }
metrics.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tower-service.workspace = true
tracing.workspace = true
hyper-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
# RFC 0005: rate limit in front of the upgrade (case 7)
dvarapala-engine.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
tower-layer.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "test-util"] }

[[bench]]
name = "handshake"
harness = false
required-features = ["tls"]
