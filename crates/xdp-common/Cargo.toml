[package]
name = "dvarapala-xdp-common"
description = "Packet parser and map layouts shared by the dvarapala XDP program and its loader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# aya::Pod for the map values, on the loader side only
aya = ["dep:aya"]

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.15.0", default-features = false, optional = true }
