[package]
name = "dvarapala-node"
description = "N-API addon over the dvarapala C ABI for the JavaScript SDK"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# sdk/js/index.d.ts is the typed surface; the addon generates no types.
[dependencies]
dvarapala-ffi.workspace = true
napi = { version = "3.15.0", default-features = false, features = ["napi3"] }
napi-derive = { version = "3.6.13", default-features = false, features = ["strict"] }

[build-dependencies]
napi-build = "2.6.0"
