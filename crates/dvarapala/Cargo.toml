[package]
name = "dvarapala"
description = "Anti-DDoS gateway: L4 to L7 protection as a reverse proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["tls", "replay"]
# TLS listener and https:// upstreams (RFC 0003).
tls = ["dvarapala-proxy/tls"]
# XGBoost scoring (RFC 0002), off by default to keep the binary small.
ml = ["dvarapala-engine/ml"]
# HTTP/3 listener over QUIC (RFC 0006), experimental.
http3 = ["tls", "dvarapala-proxy/http3"]
# Shared state across replicas (RFC 0010), each backend opt-in.
redis = ["dvarapala-store/redis"]
postgres = ["dvarapala-store/postgres"]
# `dvarapala replay` (RFC 0016).
replay = ["dvarapala-l7/replay"]
# XDP fast path (RFC 0011), Linux only.
xdp = ["dvarapala-xdp/load"]

[dependencies]
dvarapala-engine.workspace = true
dvarapala-l4.workspace = true
dvarapala-l7.workspace = true
dvarapala-proxy.workspace = true
dvarapala-store.workspace = true
dvarapala-xdp.workspace = true
figment.workspace = true
# RFC 0013: route methods; already in the tree through hyper
http.workspace = true
# RFC 0016: the replay's inner service
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
# RFC 0014: reload and admin counters; already in the tree through l7
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-layer.workspace = true
tower-service.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }

[[bench]]
name = "replay"
harness = false
required-features = ["replay"]
