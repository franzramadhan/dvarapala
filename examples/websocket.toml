# Reverse proxy for WebSocket traffic.
#
# Use case: chat, live dashboards, notifications. The upgrade request goes
# through the rate limit and detection like any request, so a reconnect
# storm is throttled before it reaches the app. Once the upstream answers
# 101, bytes are copied both ways; the tunnel limits bound what each
# admitted client can hold: how many tunnels in total, how long one may
# idle, and how long one may live, so clients reconnect through the
# current limits after an attack starts.
#
# Each idle tunnel costs about 19 KB: 10000 tunnels is about 200 MB.

listen = "0.0.0.0:8080"
# WebSocket needs HTTP/1.1 to the upstream (the default).
upstream = "http://127.0.0.1:3000"

[metrics]
listen = "127.0.0.1:9090"

# One upgrade per reconnect: a low rate is enough, and slows a storm.
[rate_limit]
rate = 5
burst = 10

[detection]
mode = "observe"

[upgrade]
protocols = ["websocket"]
max_tunnels = 10000
# Clients that send pings every 30 s stay well under this.
idle_timeout = "120s"
max_lifetime = "12h"
