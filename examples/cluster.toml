# Several replicas behind one load balancer acting as one gateway (RFC 0010).
#
# Use case: three or more replicas of the same reverse proxy. Without a
# store, each replica allows `rate` per client, so a client spread over N
# replicas by the load balancer gets N times its limit. With one, the
# replicas share a per-client count, the heavy hitters detection drops,
# and (in forward mode) each destination's budget.
#
# Why these values: Redis, synced every second, so a client over the
# cluster limit is held on every replica within two seconds. Build with
# `--features redis` (or `postgres`). The request path never waits for the
# store: if it goes away, each replica falls back to its local limits and
# logs `store unavailable`.

listen = "0.0.0.0:8080"
upstream = "http://127.0.0.1:8081"
# The load balancer sets X-Forwarded-For.
trusted_proxies = ["192.0.2.10/32"]

[metrics]
listen = "127.0.0.1:9090"

[rate_limit]
rate = 20
burst = 40

[detection]
mode = "observe"

[store]
backend = "redis"
# Put a password in DVARAPALA__STORE__URL, never in this file.
url = "rediss://<host>:6379/0"
cluster = "app"
sync_interval = "1s"
timeout = "500ms"
# PostgreSQL instead (CloudNativePG: the <cluster>-rw service or a Pooler):
# backend = "postgres"
# url = "postgres://<user>@<host>:5432/<db>?sslmode=verify-full"
