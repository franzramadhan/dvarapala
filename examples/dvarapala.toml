# Minimal reverse proxy with the default rate limit.
# Every key can be overridden by DVARAPALA__<SECTION>__<KEY>, for example
# DVARAPALA__RATE_LIMIT__RATE=5.

# "forward" runs an egress forward proxy instead, see forward-proxy.toml.
# mode = "reverse"
listen = "0.0.0.0:8080"
upstream = "http://127.0.0.1:8081"
# "http2" for gRPC upstreams (h2c, or ALPN h2 over https://); "auto" lets
# ALPN choose for https://. Top-level key: keep it above the first section.
# upstream_protocol = "http1"

# Only peers in these blocks may set X-Forwarded-For. Top-level key: keep it
# above the first [section].
# trusted_proxies = ["192.0.2.0/24"]

[metrics]
listen = "127.0.0.1:9090"

[rate_limit]
enabled = true
rate = 20
burst = 40
max_clients = 100000

# Adaptive detection (RFC 0002). Starts in observe mode: logs and metrics
# only. Watch dvarapala_detection_* settle before switching to "enforce".
[detection]
enabled = true
mode = "observe"
window = "1s"
# Group sources by prefix; shorten to 24 / 48 to catch floods spread over
# a subnet, at the cost of dropping its neighbors too.
prefix_v4 = 32
prefix_v6 = 64

# HTTPS on the listener (RFC 0003): set both to turn TLS on. SIGHUP reloads
# the pair; a bad file keeps the old one.
# [tls]
# cert = "/etc/dvarapala/cert.pem"
# key = "/etc/dvarapala/key.pem"
# handshake_timeout = "10s"
# max_handshakes = 1024

# HTTP/3 over QUIC (RFC 0006), experimental: needs a build with
# --features http3 and [tls]. Usually the TCP port, over UDP.
# [quic]
# listen = "0.0.0.0:8443"
# advertise = true
# retry = "under_load"
# retry_threshold = 256
# max_connections = 10000
# max_streams = 100
# idle_timeout = "30s"

# Verification of https:// upstreams. Default: the system roots and the
# upstream host name. There is no switch to turn verification off.
# [upstream_tls]
# ca_file = "/etc/dvarapala/upstream-ca.pem"
# server_name = "app.internal"

# HTTP/2 listener limits (RFC 0004), on by default. Each bounds what one
# client connection can hold or burn.
# [http2]
# max_concurrent_streams = 100
# max_pending_reset_streams = 20
# max_local_error_resets = 1024
# max_header_list_size = 16384
# keepalive_interval = "30s"
# keepalive_timeout = "10s"

# WebSocket upgrades (RFC 0005), on by default. Each tunnel holds about
# 19 KB; protocols = [] turns upgrades off.
# [upgrade]
# protocols = ["websocket"]
# max_tunnels = 10000
# idle_timeout = "300s"
# max_lifetime = "24h"

# Connection limits and timeouts (RFC 0009), checked before TLS or HTTP.
# Behind a load balancer, list it in exempt: the limits key on the peer.
# [l4]
# enabled = true
# max_connections = 0
# max_per_client = 256
# accept_rate = 0
# accept_burst = 64
# prefix_v4 = 32
# prefix_v6 = 64
# max_clients = 100000
# exempt = []
# header_timeout = "30s"
# idle_timeout = "60s"
# min_body_rate = 0

# Shared state across replicas (RFC 0010), in builds with the redis or
# postgres feature. Put the password in DVARAPALA__STORE__URL.
# [store]
# backend = "redis"
# url = "redis://<host>:6379/0"
# cluster = "dvarapala"
# sync_interval = "1s"
# max_keys = 10000
# timeout = "500ms"
# migrate = true
# ca_file = "/etc/dvarapala/store-ca.pem"
