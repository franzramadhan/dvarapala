# Reverse proxy for a gRPC service.
#
# Use case: gRPC clients (mobile apps, partner integrations, internal
# services) calling a public API. gRPC needs HTTP/2 to the upstream and
# trailers end to end. Local errors come back in gRPC form, so a throttled
# client sees RESOURCE_EXHAUSTED (8) with a retry pushback instead of an
# HTTP 429 its stub cannot read, and a dead upstream is UNAVAILABLE (14).
#
# The HTTP/2 listener limits are the defense against rapid reset and header
# floods; tighten max_concurrent_streams when each call is expensive.

listen = "0.0.0.0:8443"
upstream = "http://127.0.0.1:50051"
# h2c with prior knowledge to a cleartext gRPC server; with an https://
# upstream, ALPN h2.
upstream_protocol = "http2"

[metrics]
listen = "127.0.0.1:9090"

# Streams count as requests: a busy streaming client needs a larger burst
# than a browser.
[rate_limit]
rate = 50
burst = 200

[detection]
mode = "observe"

[tls]
cert = "/etc/dvarapala/fullchain.pem"
key = "/etc/dvarapala/privkey.pem"

[http2]
max_concurrent_streams = 50
max_pending_reset_streams = 20
keepalive_interval = "30s"
keepalive_timeout = "10s"
