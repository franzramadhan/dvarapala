# HTTP/3 next to HTTPS (RFC 0006), experimental.
#
# Use case: a public endpoint whose clients are often on mobile or lossy
# networks, where HTTP/3 recovers from loss faster. Needs a build with
# `cargo build --release --features http3`. QUIC uses the [tls]
# certificate; TCP responses carry Alt-Svc so browsers try UDP next time,
# and fall back to TCP when UDP is blocked.
#
# Retry under load: once 256 handshakes are in progress, a new client must
# echo a Retry token first, so a spoofed-source flood costs no handshakes.
# Open UDP 443 on the firewall too. Placeholders: <cert dir>, app.example.

listen = "0.0.0.0:443"
upstream = "http://app.example:8080"

[metrics]
listen = "127.0.0.1:9090"

[detection]
mode = "observe"

[tls]
cert = "/etc/dvarapala/<cert dir>/fullchain.pem"
key = "/etc/dvarapala/<cert dir>/privkey.pem"

[quic]
# The same port over UDP: Alt-Svc then names port 443.
listen = "0.0.0.0:443"
retry = "under_load"
retry_threshold = 256
max_connections = 10000
# Browsers open a few streams per page; 100 leaves room, a flood of
# streams on one connection waits for credit.
max_streams = 100
idle_timeout = "30s"
