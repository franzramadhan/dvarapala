# git-cliff config: `git cliff --tag v<version> -o CHANGELOG.md` on a
# release branch. release.yml publishes the section of the tagged version.

[changelog]
header = """
# Changelog

All notable changes are listed here. Generated by `git cliff` on each
release branch (see `CLAUDE.md`).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^rfc", group = "<!-- 3 -->RFCs" },
  { message = "^refactor", group = "<!-- 4 -->Refactors" },
  { message = "^docs", group = "<!-- 5 -->Docs" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^release", skip = true },
  { message = "^(chore|test)", skip = true },
]
