---
apiVersion: v1
kind: Namespace
metadata:
  name: dvarapala
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dvarapala-operator
  namespace: dvarapala
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dvarapala-operator
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [dvarapala.franzramadhan.dev]
    resources: [dvarapalapolicies]
    verbs: [get, list, watch]
  - apiGroups: [dvarapala.franzramadhan.dev]
    resources: [dvarapalapolicies/status]
    verbs: [patch]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, grpcroutes]
    verbs: [get, list, watch, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: [dvarapala-operator]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dvarapala-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dvarapala-operator
subjects:
  - kind: ServiceAccount
    name: dvarapala-operator
    namespace: dvarapala
---
# The webhook's serving certificate, created on first start.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dvarapala-operator
  namespace: dvarapala
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dvarapala-operator
  namespace: dvarapala
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dvarapala-operator
subjects:
  - kind: ServiceAccount
    name: dvarapala-operator
    namespace: dvarapala
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvarapala-operator
  namespace: dvarapala
  labels:
    app.kubernetes.io/name: dvarapala-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dvarapala-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dvarapala-operator
    spec:
      serviceAccountName: dvarapala-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dvarapala-operator
      containers:
        - name: operator
          image: ghcr.io/franzramadhan/dvarapala-operator:__VERSION__
          args: [run, --gateway-image, "ghcr.io/franzramadhan/dvarapala:__VERSION__"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: 9443
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dvarapala-operator
  namespace: dvarapala
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dvarapala-operator
---
apiVersion: v1
kind: Service
metadata:
  name: dvarapala-operator
  namespace: dvarapala
spec:
  selector:
    app.kubernetes.io/name: dvarapala-operator
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
---
# Two entries: a labeled route anywhere, or any route in a labeled
# namespace. A route matching both is rewritten once (the rewrite is
# idempotent). Fail, never Ignore: a labeled route is not stored unrewritten.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: dvarapala-operator
webhooks:
  - name: routes.dvarapala.franzramadhan.dev
    objectSelector:
      matchExpressions:
        - {key: dvarapala.franzramadhan.dev/policy, operator: Exists}
    namespaceSelector:
      matchExpressions:
        - {key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system, dvarapala]}
    rules: &rules
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        resources: [ingresses]
        operations: [CREATE, UPDATE]
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: [v1]
        resources: [httproutes, grpcroutes]
        operations: [CREATE, UPDATE]
    clientConfig: &client
      service:
        name: dvarapala-operator
        namespace: dvarapala
        path: /mutate
    admissionReviewVersions: [v1]
    sideEffects: NoneOnDryRun
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
  - name: namespaces.dvarapala.franzramadhan.dev
    namespaceSelector:
      matchExpressions:
        - {key: dvarapala.franzramadhan.dev/policy, operator: Exists}
        - {key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system, dvarapala]}
    rules: *rules
    clientConfig: *client
    admissionReviewVersions: [v1]
    sideEffects: NoneOnDryRun
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
