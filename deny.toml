# cargo deny check (ci.yml, job deny): advisories, licenses, bans, sources.

[graph]
all-features = true

[advisories]
# RustSec advisory database; unmaintained and yanked crates fail too
unmaintained = "all"
yanked = "deny"

[licenses]
# permissive only, compatible with MIT distribution of static binaries
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace path deps have no version; allowed while the crates are
# private (publish = false). Publishing the SDK crates is its own RFC.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
