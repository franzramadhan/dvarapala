[workspace]
resolver = "3"
members = ["crates/*"]
# the BPF program: nightly and bpf-linker, its own workspace
exclude = ["crates/xdp-ebpf"]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/franzramadhan/dvarapala"
rust-version = "1.99"
publish = false

[workspace.dependencies]
dvarapala-engine = { path = "crates/engine" }
dvarapala-ffi = { path = "crates/ffi" }
dvarapala-l4 = { path = "crates/l4" }
dvarapala-l7 = { path = "crates/l7" }
dvarapala-proxy = { path = "crates/proxy" }
dvarapala-store = { path = "crates/store" }
dvarapala-xdp = { path = "crates/xdp" }
dvarapala-xdp-common = { path = "crates/xdp-common" }

bytes = "1.12.1"
figment = { version = "0.10.19", default-features = false, features = ["toml", "env"] }
http = "1.5.0"
http-body-util = "0.1.5"
h2 = { version = "0.4.20", default-features = false }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
pin-project-lite = "0.2.17"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
libc = { version = "0.2.191", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# RFC 0006: HTTP/3, experimental
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
criterion = { version = "0.8.2", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# Small static binary. Panics unwind (no panic = "abort"): a panic in one
# connection task must not take the whole proxy down.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
